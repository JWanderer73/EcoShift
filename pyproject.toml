[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-windows"
version = "0.1.0"
description = "Find the lowest-emission time windows for heavy workloads"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "boto3>=1.34",
  "numpy>=1.26",
  "httpx>=0.27",
]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13"]
dashboard = ["streamlit>=1.50"]
dev = ["pytest>=8", "moto[dynamodb,s3,cloudwatch]>=5"]

[project.scripts]
carbon-windows = "carbon.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with:Warning"]
